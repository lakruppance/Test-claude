[project]
name = "clipper"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "anthropic==1.11.0",
  "assemblyai==1.6.1",
  "boto3>=1.35",
  "httpx>=0.27",
  "mediapipe==0.10.21",
  "numpy>=1.26,<2.2",
  "opencv-python-headless>=4.10",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "modal==1.6.1", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
